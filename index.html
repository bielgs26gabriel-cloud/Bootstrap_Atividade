<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Bootstrap_Silvio</title>
</head>

<body>
    <img src="img/imagem - 01.jpg" class="rounded mx-auto d-block" width="100" height="100">
    <ul class="nav justify-content-center">
        <li class="nav-item">
            <a class="nav-link" href="#" role="button" data-bs-toggle="menu" aria-expanded="false">Menu</a>
            <div class="menu">
                <a class="menu-item" href="#">Assinatura</a>
                <hr class="menu-divider">
                <a class="menu-item" href="#">Compra</a>
                <hr class="menu-divider">
                <a class="menu-item" href="#">Pagamento</a>
                <hr class="menu-divider">
                <a class="menu-item" href="#">Produtos</a>
            </div>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="contato.html">Contato</a>
        </li>
    </ul>

    <div id="carouselExampleInterval" class="carousel slide" data-bs-autoplay="true">
        <div class="carousel-inner rounded-5">
            <div class="carousel-item active" data-bs-interval="2000">
                <img src="img/Barbeiro.webp" class="d-block w-100" width="20" height="320">
            </div>
            <div class="carousel-item" data-bs-interval="4000">
                <img src="img/Cabeleleiro.webp" class="d-block w-100" width="20" height="320">
            </div>
            <div class="carousel-item" data-bs-interval="6000">
                <img src="img/Barbeiro Criança.webp" class="d-block w-100" width="20" height="320">
            </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-3">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="0" class="active"
                    aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="1"
                    aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="2"
                    aria-label="Slide 3"></button>
            </div>
            <button class="btn-icon btn-sm carousel-control-play-pause" type="button"
                data-bs-target="#carouselExampleInterval" aria-label="Pause" data-bs-pause-label="Pause"
                data-bs-play-label="Play">
                <span class="carousel-icon-pause" aria-hidden="true"></span>
                <span class="carousel-icon-play" aria-hidden="true"></span>
            </button>
        </div>
    </div>

    <div class="container mt-7"
        style="width: 400px; height: 300px; background-color: border-radius: 10px; padding: 20px;">
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Cabelo</th>
                    <th scope="col">Preço</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">1</th>
                    <td>Masculino</td>
                    <td>45,00</td>
                </tr>
                <tr>
                    <th scope="row">2</th>
                    <td>Feminino</td>
                    <td>45,00</td>
                </tr>
                <tr>
                    <th scope="row">3</th>
                    <td>Criança</td>
                    <td>30,00</td>
                </tr>
            </tbody>
        </table>

        <section class="d-flex align-items-start" style="max-width: 620px">

            <div class="card" style="width: 18rem;">
                <img src="img/H.png" class="card-img-top" alt="...">
                <div class="card-body">
                    <p class="card-text">Homens</p>
                </div>
            </div>
            <div class="card" style="width: 18rem;">
                <div class="card-body">
                    <p class="card-text">Mulheres</p>
                </div>
                <img src="img/M.png" class="card-img-bottom" alt="...">
            </div>
            <div class="card" style="width: 18rem;">
                <img src="img/C.png" class="card-img-top" alt="...">
                <div class="card-body">
                    <p class="card-text">Crianças</p>
                </div>
            </div>

    

    </div>

    </section>
